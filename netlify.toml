[build]
  command = "npm run build"
  publish = "dist/public"
  functions = "dist/netlify/functions"

[[redirects]]
  from = "/api/categories"
  to = "/.netlify/functions/tools/categories"
  status = 200

[[redirects]]
  from = "/api/tools/:slug"
  to = "/.netlify/functions/tools/:slug"
  status = 200

[[redirects]]
  from = "/api/tools"
  to = "/.netlify/functions/tools"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
